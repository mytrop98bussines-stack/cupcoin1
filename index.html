<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- CORREGIDO: Declaramos soporte para ambos modos para bloquear el auto-dark forzado de Android -->
    <meta name="color-scheme" content="light dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="description" content="CubaX — Plataforma integral de finanzas, P2P y comercio cripto para el mercado cubano" />
    <title>CubaX — Plataforma P2P & Crypto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- FAVICON: Referencia a favicon.svg en public -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- PWA: Manifest para Progressive Web App -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="/favicon.svg" />

    <!-- Android & Branding -->
    <meta name="theme-color" content="#3b82f6" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- CORREGIDO: Alineado para navegadores Chromium móviles -->
    <meta name="supported-color-schemes" content="light dark" />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        background-color: #f9fafb; /* Equivale a tu bg-gray-50 base */
      }
      /* Si el usuario tenía guardado el tema oscuro, React inyectará 'dark' inmediatamente */
      html.dark, html.dark body {
        background-color: #030712 !important; /* Equivale a tu bg-navy-950 real de CubaX */
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
