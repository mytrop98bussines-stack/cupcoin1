name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main # O master, según tu rama principal

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Force Firebase Install
        run: bun add firebase firebase-tools

      - name: Build Project
        run: bun run --bun vite build

      # Paso de verificación para asegurar que 'dist' existe con su index.html
      - name: Verify Build Directory
        run: ls -la dist

      # Despliegue usando la acción oficial de Firebase que maneja cuentas de servicio nativamente
      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CUPCOIN_B2B4F }}
          projectId: cupcoin-b2b4f
          channelId: live
          
