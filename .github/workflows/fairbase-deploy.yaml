name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # ✅ Añadir firebase si no está en package.json
      - name: Install Firebase SDK
        run: bun add firebase

      - name: Build Project
        run: bun run --bun vite build

      - name: Verify Build Directory
        run: |
          echo "Contenido de dist:"
          ls -la dist
          test -f dist/index.html && echo "✅ index.html existe" || echo "❌ index.html NO existe"

      - name: Setup Node.js (para Firebase deploy)
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CUPCOIN_B2B4F }}
          projectId: cupcoin-b2b4f
          channelId: live
