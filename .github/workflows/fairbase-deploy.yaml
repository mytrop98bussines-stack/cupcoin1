steps:
  - name: Checkout repo
    uses: actions/checkout@v4

  - name: Setup Bun
    uses: oven-sh/setup-bun@v2
    with:
      bun-version: latest

  - name: Install dependencies
    run: bun install

  - name: Create .env file
    run: |
      echo "VITE_FIREBASE_API_KEY=${{ secrets.VITE_FIREBASE_API_KEY }}" >> .env
      echo "VITE_FIREBASE_AUTH_DOMAIN=${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}" >> .env
      echo "VITE_FIREBASE_PROJECT_ID=${{ secrets.VITE_FIREBASE_PROJECT_ID }}" >> .env
      echo "VITE_FIREBASE_STORAGE_BUCKET=${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}" >> .env
      echo "VITE_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}" >> .env
      echo "VITE_FIREBASE_APP_ID=${{ secrets.VITE_FIREBASE_APP_ID }}" >> .env
      echo "VITE_FIREBASE_VAPID_KEY=${{ secrets.VITE_FIREBASE_VAPID_KEY }}" >> .env

  - name: Inject Firebase config into SW
    run: |
      sed -i "s/REPLACE_API_KEY/${{ secrets.VITE_FIREBASE_API_KEY }}/g" public/firebase-messaging-sw.js
      sed -i "s/REPLACE_AUTH_DOMAIN/${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}/g" public/firebase-messaging-sw.js
      sed -i "s/REPLACE_PROJECT_ID/${{ secrets.VITE_FIREBASE_PROJECT_ID }}/g" public/firebase-messaging-sw.js
      sed -i "s/REPLACE_STORAGE_BUCKET/${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}/g" public/firebase-messaging-sw.js
      sed -i "s/REPLACE_MESSAGING_SENDER_ID/${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}/g" public/firebase-messaging-sw.js
      sed -i "s/REPLACE_APP_ID/${{ secrets.VITE_FIREBASE_APP_ID }}/g" public/firebase-messaging-sw.js
      sed -i "s/REPLACE_VAPID_KEY/${{ secrets.VITE_FIREBASE_VAPID_KEY }}/g" public/firebase-messaging-sw.js

  - name: Build Project
    run: bun run --bun vite build

  - name: Verify Build Directory
    run: |
      echo "Contenido de dist:"
      ls -la dist
      test -f dist/index.html && echo "✅ index.html existe"

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Deploy to Firebase Hosting
    uses: FirebaseExtended/action-hosting-deploy@v0
    with:
      repoToken: ${{ secrets.GITHUB_TOKEN }}
      firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CUPCOIN_B2B4F }}
      projectId: cupcoin-b2b4f
      channelId: live
