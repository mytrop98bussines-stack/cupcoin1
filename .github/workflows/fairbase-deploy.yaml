name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_VAPID_KEY: ${{ secrets.VITE_FIREBASE_VAPID_KEY }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Generate firebase-messaging-sw.js
        run: |
          cat > public/firebase-messaging-sw.js <<EOF
          importScripts('https://www.gstatic.com/firebasejs/11.0.0/firebase-app-compat.js');
          importScripts('https://www.gstatic.com/firebasejs/11.0.0/firebase-messaging-compat.js');

          firebase.initializeApp({
            apiKey: "$VITE_FIREBASE_API_KEY",
            authDomain: "$VITE_FIREBASE_AUTH_DOMAIN",
            projectId: "$VITE_FIREBASE_PROJECT_ID",
            storageBucket: "$VITE_FIREBASE_STORAGE_BUCKET",
            messagingSenderId: "$VITE_FIREBASE_MESSAGING_SENDER_ID",
            appId: "$VITE_FIREBASE_APP_ID"
          });

          const messaging = firebase.messaging();

          messaging.onBackgroundMessage((payload) => {
            const notificationTitle = payload.notification?.title || 'Nueva notificación';
            const notificationOptions = {
              body: payload.notification?.body || '',
              icon: '/firebase-logo.png'
            };

            self.registration.showNotification(notificationTitle, notificationOptions);
          });
          EOF

      - name: Build Project
        run: bun run build

      - name: Verify Build Directory
        run: |
          echo "Contenido de dist:"
          ls -la dist
          test -f dist/index.html && echo "✅ index.html existe"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CUPCOIN_B2B4F }}
          projectId: cupcoin-b2b4f
          channelId: live
