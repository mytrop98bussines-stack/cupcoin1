<!DOCTYPE html>
<html>
<head>
  <title>Generar íconos CupCoin</title>
  <style>
    body { font-family: Arial; padding: 20px; background: #f5f5f5; }
    .box { background: white; padding: 20px; margin: 15px 0; border-radius: 12px; text-align: center; }
    canvas { border: 1px solid #eee; margin: 10px auto; display: block; }
    button {
      background: #000; color: white; padding: 12px 24px;
      border: none; border-radius: 8px; cursor: pointer;
      font-weight: bold; margin-top: 10px;
    }
    h3 { margin: 0 0 10px 0; }
  </style>
</head>
<body>
  <h1>🪙 Íconos CupCoin PWA</h1>
  <p>Descarga cada tamaño y súbelos a la carpeta <b>public/</b> de tu proyecto.</p>

  <div class="box">
    <h3>192x192 (Android/PWA)</h3>
    <canvas id="c192" width="192" height="192"></canvas>
    <button onclick="descargar('c192', 'icon-192.png')">Descargar icon-192.png</button>
  </div>

  <div class="box">
    <h3>512x512 (Splash Screen)</h3>
    <canvas id="c512" width="512" height="512"></canvas>
    <button onclick="descargar('c512', 'icon-512.png')">Descargar icon-512.png</button>
  </div>

  <div class="box">
    <h3>Apple 180x180 (iOS)</h3>
    <canvas id="c180" width="180" height="180"></canvas>
    <button onclick="descargar('c180', 'apple-touch-icon.png')">Descargar apple-touch-icon.png</button>
  </div>

  <script>
    function renderCanvas(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      // Fondo negro con esquinas redondeadas
      const radius = size * 0.23;
      ctx.fillStyle = '#000000';
      ctx.beginPath();
      ctx.moveTo(radius, 0);
      ctx.lineTo(size - radius, 0);
      ctx.quadraticCurveTo(size, 0, size, radius);
      ctx.lineTo(size, size - radius);
      ctx.quadraticCurveTo(size, size, size - radius, size);
      ctx.lineTo(radius, size);
      ctx.quadraticCurveTo(0, size, 0, size - radius);
      ctx.lineTo(0, radius);
      ctx.quadraticCurveTo(0, 0, radius, 0);
      ctx.closePath();
      ctx.fill();

      // Letra c blanca centrada
      ctx.fillStyle = 'white';
      ctx.font = `900 ${size * 0.82}px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('c', size / 2, size / 2 + size * 0.03);
    }

    function descargar(canvasId, nombre) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = nombre;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    renderCanvas('c192', 192);
    renderCanvas('c512', 512);
    renderCanvas('c180', 180);
  </script>
</body>
</html>
